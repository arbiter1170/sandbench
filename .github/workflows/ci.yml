name: CI

on:
  pull_request:
  push:
    branches: [deploy/vercel, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Electron is only needed for the desktop build, not for CI.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # SB-02 datastore tests run against this throwaway database (CI only).
      TEST_DATABASE_URL: postgres://sandbench:ci-only@127.0.0.1:5432/sandbench_test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: sandbench
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: sandbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbench -d sandbench_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:web
      - run: npm ci --prefix runner --no-audit --no-fund
      - name: Chromium for the screenshot tests (SB-13)
        working-directory: runner
        run: npx playwright install --with-deps chromium
      - run: npm run test:node
      - name: The datastore tests ran (not skipped)
        run: |
          set -o pipefail
          node --test runner/test/data.test.mjs 2>&1 | tee /tmp/data.log
          grep -q "^# skipped 0" /tmp/data.log
          node --test runner/test/memory.test.mjs 2>&1 | tee /tmp/memory.log
          grep -q "^# skipped 0" /tmp/memory.log
      - run: npm run build
      - name: No API keys in the page bundle
        run: |
          if grep -rEn 'sk-ant-[A-Za-z0-9]|xai-[A-Za-z0-9]{20}|ghp_[A-Za-z0-9]{20}|github_pat_[A-Za-z0-9]' dist/; then
            echo "::error::An API key pattern was found in dist/."
            exit 1
          fi

  runner-auth:
    name: Runner sign-in checks (Auth emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: runner/package-lock.json
      - run: npm ci --prefix runner --no-audit --no-fund
      - name: Real ID tokens against the demo-sandbench emulator
        working-directory: runner/test/emulator
        run: >
          npx --yes firebase-tools@14 emulators:exec --only auth --project demo-sandbench
          "node --test ../emulator.test.mjs"

  runner-image:
    name: Runner image and compose file
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: compose.yml is valid (placeholder values, CI only)
        env:
          FIREBASE_PROJECT_ID: demo-sandbench
          SANDBENCH_ALLOWED_EMAILS: ci@example.test
          SANDBENCH_PUBLIC_ORIGIN: https://sandbench.example.test
          POSTGRES_PASSWORD: ci-only
          CLOUDFLARE_TUNNEL_TOKEN: ci-only
          TS_AUTHKEY: ci-only
        # The step name is a required check's job name; only the command changed.
        run: |
          docker compose -f deploy/compose.yml config -q
          for profile in laptop cloudflare; do
            docker compose -f deploy/compose.yml --profile "$profile" config -q
          done
          test "$(docker compose -f deploy/compose.yml --profile laptop config --services | sort | tr '\n' ' ')" = "postgres runner tailscale "
          test "$(docker compose -f deploy/compose.yml --profile cloudflare config --services | sort | tr '\n' ' ')" = "cloudflared postgres runner "
          python3 -c "import json; json.load(open('deploy/tailscale/serve.json'))"
      - name: No service publishes a port
        run: |
          if grep -nE '^\s+ports:' deploy/compose.yml; then
            echo "::error::deploy/compose.yml must not publish ports; the tunnel is the only way in."
            exit 1
          fi
      - run: docker build -f runner/Dockerfile -t sandbench-runner:ci .
      - name: Image starts, serves the UI, and /api needs a token
        run: |
          docker run -d --name runner -p 127.0.0.1:8080:8080 \
            -e FIREBASE_PROJECT_ID=demo-sandbench -e SANDBENCH_ALLOWED_EMAILS=ci@example.test \
            -e FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 sandbench-runner:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = 401
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker logs runner

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git /repo --redact --no-banner --exit-code 1
      - name: No personal email addresses in tracked files
        run: |
          if git ls-files -z -- . ':!:package-lock.json' ':!:runner/package-lock.json' \
              | xargs -0 grep -nEI '[A-Za-z0-9._%+-]+@(gmail|googlemail|yahoo|hotmail|outlook|icloud|me|proton|protonmail)\.[a-z]{2,}'; then
            echo "::error::A personal email address is committed. Use an env var (VITE_ALLOWED_EMAILS / SANDBENCH_ALLOWED_EMAILS) instead."
            exit 1
          fi

# Sandbench runner: runner + Postgres, plus one way in, picked with COMPOSE_PROFILES:
#   laptop     -> Tailscale Funnel (https://<name>.<tailnet>.ts.net), no domain needed
#   cloudflare -> Cloudflare named tunnel + Access (needs a domain; the "server later" path)
# No service publishes a port; the tunnel sidecar is the only way in. The same file runs
# on a laptop or a VPS.
#
#   cp deploy/.env.example deploy/.env   # fill it in on the host; never commit it
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
name: sandbench

services:
  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
      SANDBENCH_ALLOWED_EMAILS: ${SANDBENCH_ALLOWED_EMAILS:?set SANDBENCH_ALLOWED_EMAILS}
      # The runner's own https address, and other pages allowed to call /api (exact origins).
      SANDBENCH_PUBLIC_ORIGIN: ${SANDBENCH_PUBLIC_ORIGIN:-}
      SANDBENCH_ALLOWED_ORIGINS: ${SANDBENCH_ALLOWED_ORIGINS:-}
      SANDBENCH_BLOCKED_PROJECTS: ${SANDBENCH_BLOCKED_PROJECTS:-}
      # Used from SB-02 on.
      DATABASE_URL: postgres://sandbench:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sandbench
    volumes:
      - sandbench-data:/srv/sandbench
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandbench
      POSTGRES_DB: sandbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbench -d sandbench"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  # Server later: a Cloudflare named tunnel whose public hostname points at http://runner:8080,
  # behind Cloudflare Access. Only started with COMPOSE_PROFILES=cloudflare.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [runner]
    networks: [edge]

  # Laptop: Tailscale Funnel gives a stable https://<TS_HOSTNAME>.<tailnet>.ts.net address
  # with a real certificate and forwards it to http://runner:8080 (tailscale/serve.json).
  # There is no outer sign-in gate here: the runner's token check and allowlist are the gate.
  tailscale:
    image: tailscale/tailscale:v1.102.5
    profiles: [laptop]
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-sandbench}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-sandbench}
      TS_STATE_DIR: /var/lib/tailscale
      # Userspace networking works on Docker Desktop (Windows and macOS) without /dev/net/tun.
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on: [runner]
    networks: [edge]

networks:
  # Postgres is only on the internal network, which has no route out.
  internal:
    internal: true
  edge: {}

volumes:
  sandbench-data:
  postgres-data:
  tailscale-state:

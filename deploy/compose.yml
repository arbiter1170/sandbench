# Sandbench on the runner VM: runner + Postgres + cloudflared.
# No service publishes a port. The only way in is the Cloudflare Tunnel, behind
# Cloudflare Access (Google sign-in, allowlist), and then the runner's own token check.
#
#   cp deploy/.env.example deploy/.env   # fill it in on the VM; never commit it
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
name: sandbench

services:
  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID}
      SANDBENCH_ALLOWED_EMAILS: ${SANDBENCH_ALLOWED_EMAILS:?set SANDBENCH_ALLOWED_EMAILS}
      SANDBENCH_PUBLIC_ORIGIN: ${SANDBENCH_PUBLIC_ORIGIN:?set SANDBENCH_PUBLIC_ORIGIN}
      SANDBENCH_BLOCKED_PROJECTS: ${SANDBENCH_BLOCKED_PROJECTS:-}
      # Model and voice keys (optional here; they can also be added from Settings > Keys).
      XAI_API_KEY: ${XAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      COMPAT_API_KEY: ${COMPAT_API_KEY:-}
      DECISION_API_KEY: ${DECISION_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      FISH_API_KEY: ${FISH_API_KEY:-}
      # Used from SB-02 on.
      DATABASE_URL: postgres://sandbench:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/sandbench
    volumes:
      - sandbench-data:/srv/sandbench
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandbench
      POSTGRES_DB: sandbench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbench -d sandbench"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    # The tunnel's public hostname points at http://runner:8080 (set in the Cloudflare dashboard).
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [runner]
    networks: [edge]

networks:
  # Postgres is only on the internal network, which has no route out.
  internal:
    internal: true
  edge: {}

volumes:
  sandbench-data:
  postgres-data:
